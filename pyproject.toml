[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura"
version = "0.1.0"
description = "Incremental Structure-from-Motion and point-cloud processing in NumPy/SciPy/OpenCV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dang Truong Minh Le", email = "dang.le@mbzuai.ac.ae" }]
keywords = ["structure-from-motion", "3d-reconstruction", "computer-vision", "point-cloud", "bundle-adjustment"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "Pillow>=9.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
structura-reconstruct = "structura.cli:reconstruct"

[tool.setuptools.packages.find]
include = ["structura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
