name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch + OpenCLIP for the vision-language tests)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,clip]"
      - run: ruff check .
      - run: pytest -q
      - name: Synthetic end-to-end reconstruction
        run: python tools/demo_synthetic.py --cameras 8 --points-per-object 200
      - name: Synthetic language-driven query
        run: python tools/demo_semantics.py --cameras 8 --points-per-object 400
